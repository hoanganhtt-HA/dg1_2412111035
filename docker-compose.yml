version: '3.8'

services:
  web:
    build: .
    # Không dùng `ports` để giấu cổng service web khỏi máy host
    volumes:
      # Mount thư mục ./app/data của máy host vào /app/app/data trong container
      - ./app/data:/app/app/data
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80" # Công bố cổng 8081 ra ngoài máy host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always
